name: KAMP fixed q95 analysis
on:
  push:
    branches: ["experiments/intraday-v1"]
    paths:
      - "onset_fixed_q95.py"
      - "fixed_q95_report.py"
      - ".github/workflows/fixed-q95.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kamp-onset-v2-research
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intraday.txt
      - name: Install fixed research environment
        run: python -m pip install -r requirements-intraday.txt
      - name: Check syntax and original data
        run: |
          python -m py_compile onset_fixed_q95.py fixed_q95_report.py
          python run_stage.py check
      - name: Train and evaluate full-horizon onset model
        run: python -u onset_fixed_q95.py
      - name: Verify and write report
        run: |
          python -u fixed_q95_report.py
          python onset_fixed_q95.py --at "2021-07-01 07:00"
      - name: Keep complete experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kamp-fixed-q95
          path: |
            outputs/onset_fixed_q95/
            figures/fixed_q95/
            docs/FIXED_Q95_RESULTS.md
          retention-days: 7
          if-no-files-found: warn
      - name: Commit successful research checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out = Path("outputs/onset_fixed_q95")
          config = json.loads((out/"selected_model.json").read_text())
          paths = [str(p) for p in out.glob("*.csv") if p.name != "predictions.csv"]
          paths += [str(p) for p in out.glob("*.json")]
          paths += [str(out/config["model_file"])]
          paths += [str(p) for p in Path("figures/fixed_q95").glob("*.svg")]
          paths += [str(p) for p in Path("figures/fixed_q95").glob("*.png")]
          paths += [str(p) for p in (out/"regression").glob("*.csv") if p.name != "window_peaks.csv"]
          paths += [str(p) for p in (out/"regression").glob("*.txt")]
          paths += [ "docs/FIXED_Q95_RESULTS.md", "PROJECT_STATUS.md", "HANDOFF.md"]
          subprocess.run(["git", "add", *paths], check=True)
          PY
          git commit -m "Complete fixed JanMar q95 regression and onset analysis"
          git push origin HEAD:experiments/intraday-v1
